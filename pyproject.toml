[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.6"
dependencies = [
    "anthropic",
    "langchain-anthropic>=1.6.1",
    "langchain-core",
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.4",
    "pypdf>=6.16.2",
    "wikipedia-api>=0.15.0",
    "python-dotenv>=1.2.3",
    "tiktoken>=0.14.0",
    "voyageai>=0.5.0",
    "qdrant-client>=1.19.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

dev = [
    "ipykernel>=7.3.0",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
]
